        tags: [argocd, directory, recurse, exclude, jsonnet, extVars]
        learning_goals:
          - Create an Application for a plain-manifest directory with recurse and exclude
          - Create an Application that renders Jsonnet with external variables
          - Confirm what Argo CD delivered from the live objects
        resources:
          - name: "Argo CD directory applications"
