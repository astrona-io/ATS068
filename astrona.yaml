        path: sections/section-020/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 20m
        topic: argocd
        task_kind: build
        tags: [argocd, git, commit-id, tag, targetRevision, pinning]
        learning_goals:
          - Resolve a tag to the commit ID it points at
          - Pin an Application to a fixed commit so it does not follow the branch
          - Confirm the delivered release from the live objects
        resources:
