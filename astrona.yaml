        difficulty: intermediate
        estimated_duration: 25m
        topic: argocd
        task_kind: build
        tags: [argocd, helm, kustomize, valuesObject, releaseName, image-override]
        learning_goals:
          - Render a Helm chart in an Argo CD Application with a release name and values
