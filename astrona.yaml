# Reading, playgrounds, graded labs and quizzes. Nothing here was run on a cluster; YAML knowledge checks are listed as quiz entries.
training:
  id: ATS068
  title: 'CGOA: Tooling'
  description: "Reading material, playgrounds, graded labs, capstones and knowledge checks for CGOA: Tooling. Technical content remains draft and everything is built untested."
  certification:
    name: Certified GitOps Associate
    code: CGOA
    provider: CNCF / Linux Foundation
    domain: Tooling
    weight: 14
    competencies:
    - Manifest Format and Packaging
    - State Store Systems (Git and alternatives)
    - Reconciliation Engines (ArgoCD, Flux, and alternatives)
    - Interoperability with Notifications, Observability, and Continuous Integration Tools
modules:
  - id: module-intro
    title: Introduction
    description: Audience, reading method and review process.
    content:
    - type: reading
      title: Introduction
      path: sections/intro/README.md
    - type: reading
      title: Welcome To The Course
      path: sections/intro/course-01-welcome.md
    - type: reading
      title: Get Your Machine Ready
      path: sections/intro/course-02-get-your-machine-ready.md
    - type: reading
      title: How This Course Is Made
      path: sections/intro/course-03-how-this-course-is-made.md
