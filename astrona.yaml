  - id: module-020
    title: "State Store Systems (Git and alternatives)"
    description: >
      Makes the reader able to explain how a GitOps engine identifies and
      retrieves a version from Git and from other stores, pin an Application to
      a fixed commit, and recover from a bad release with a revert.
    content:
      - type: reading
        title: "Section Overview"
