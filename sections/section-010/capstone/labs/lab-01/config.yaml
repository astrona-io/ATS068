# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Capstone: Fix A Broken Overlay And Deliver It (LAB). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-068-lab-010-capstone
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and prepares credentials"
      type: file
      source: bootstrap/03-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: "Reference solution applied by astrona test"
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: overlay-fixed-in-git
      description: "The patch in overlays/preview targets scout and the base is unchanged"
      type: file
      source: validation/validate-overlay-fixed-in-git.sh
      hint: "Read the Argo CD error, then fix the name in the patch file in Git. Do not change base/."
    - name: preview-application
      description: "Application scout-preview uses overlays/preview on main with automated sync and self-heal"
      type: file
      source: validation/validate-preview-application.sh
      hint: "Create the Application in the namespace argocd. Self-heal sits under syncPolicy.automated."
    - name: preview-rendered
      description: "Argo CD renders the overlay without a comparison error"
      type: file
      source: validation/validate-preview-rendered-without-errors.sh
      hint: "Push the fix, then refresh the Application."
    - name: preview-delivered
      description: "scout runs in starfleet-preview with 3 replicas and message preview"
      type: file
      source: validation/validate-preview-delivered.sh
      hint: "Add CreateNamespace=true to the sync options."

teardown:
  keepCluster: false
