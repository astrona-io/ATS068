# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Deliver Manifests From An OCI Artifact With Flux (LAB). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-068-lab-020-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - ghcr.io/fluxcd/source-controller:v1.9.6
      - ghcr.io/fluxcd/kustomize-controller:v1.9.6
      - ghcr.io/fluxcd/helm-controller:v1.6.5
      - ghcr.io/fluxcd/notification-controller:v1.9.4
      - ghcr.io/fluxcd/flux-cli:v2.9.6
      - public.ecr.aws/docker/library/registry:2.8.3
  portForwards:
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
    - name: registry
      type: file
      source: manifests/registry.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-flux
      description: "Installs the Flux 2.9.6 controllers"
      type: file
      source: bootstrap/02-install-flux.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and prepares credentials"
      type: file
      source: bootstrap/03-seed.sh
    - name: push-artifacts
      description: "Pushes two versions of the scout manifests to the registry as OCI artifacts"
      type: file
      source: bootstrap/04-push-artifacts.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: "Reference solution applied by astrona test"
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: ocirepository
      description: "OCIRepository scout-oci follows the 1.0.x range over plain HTTP and is Ready"
      type: file
      source: validation/validate-ocirepository.sh
      hint: "Set spec.ref.semver and spec.insecure. Read the Ready condition message."
    - name: kustomization
      description: "Kustomization scout-oci reads the OCIRepository and applies to starfleet-staging with prune"
      type: file
      source: validation/validate-kustomization.sh
      hint: "The sourceRef kind is OCIRepository. The path of the artifact root is ./."
    - name: delivered
      description: "scout runs one replica with message oci-one from artifact 1.0.0"
      type: file
      source: validation/validate-delivered.sh
      hint: "The range 1.0.x must not select 1.1.0."

teardown:
  keepCluster: false
