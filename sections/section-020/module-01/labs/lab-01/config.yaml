# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Pin An Application To A Release Commit (LAB). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-068-lab-020-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and prepares credentials"
      type: file
      source: bootstrap/03-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: "Reference solution applied by astrona test"
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: application-pinned
      description: "The Application follows the full commit ID of the tag v1.0.0"
      type: file
      source: validation/validate-application-pinned.sh
      hint: "Resolve the tag to a commit with git ls-remote or git rev-parse and use the 40-character ID as targetRevision."
    - name: release-delivered
      description: "Release 1.0.0 is delivered: podinfo 6.14.0 and message staging"
      type: file
      source: validation/validate-release-delivered.sh
      hint: "Add CreateNamespace=true. Wait for Synced and Healthy."
    - name: main-moved-on
      description: "main is ahead of the tag and the Application did not follow it"
      type: file
      source: validation/validate-main-moved-on.sh
      hint: "Do not move the tag or rewrite main."

teardown:
  keepCluster: false
