# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Capstone: Roll Back A Bad Release With Git Revert (LAB). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-068-lab-020-capstone
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and prepares credentials"
      type: file
      source: bootstrap/03-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: "Reference solution applied by astrona test"
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: reverted-in-git
      description: "A revert commit restores 6.14.0 and the bad release stays in the history"
      type: file
      source: validation/validate-reverted-in-git.sh
      hint: "Use git revert on the bad commit and push. Do not force-push or reset."
    - name: staging-recovered
      description: "scout-staging is Synced and Healthy on 6.14.0"
      type: file
      source: validation/validate-staging-recovered.sh
      hint: "Argo CD applies the new commit by itself. A hard refresh can speed it up."
    - name: application-follows-main
      description: "The Application still follows main with automated prune and self-heal"
      type: file
      source: validation/validate-application-follows-main.sh
      hint: "Fix the problem in Git. Do not pin the Application or turn off automation."

teardown:
  keepCluster: false
