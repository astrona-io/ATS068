# Knowledge check for section-030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats068-030
course_id: ATS068
exam_code: CGOA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Reconciliation Engines (ArgoCD, Flux, and alternatives)"
questions:
  - id: ats068-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the Argo CD component that renders manifests"
    source_readings:
      - sections/section-030/module-01/course-01-argo-cd-components-and-the-reconciliation-loop.md
    prompt: |-
      Which Argo CD component fetches the repository and renders Helm or Kustomize into manifests?
    options:
      - id: a
        text: "The API server."
        explanation: "The API server serves the UI and the command-line tool."
      - id: b
        text: "The repo-server."
        explanation: "Correct. It clones the repository and runs the renderer."
      - id: c
        text: "Redis."
        explanation: "Redis is a cache."
      - id: d
        text: "The application controller."
        explanation: "The controller compares the rendered result with the cluster and applies it."
    correct_option: b
    explanation: "The repo-server renders. The controller compares and applies."

  - id: ats068-030-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Read the sync status"
    source_readings:
      - sections/section-030/module-01/course-01-argo-cd-components-and-the-reconciliation-loop.md
    prompt: |-
      An Application shows `OutOfSync` and `Missing`, and nothing is created. What is the most likely reason?
    options:
      - id: a
        text: "The Application has no automated sync policy, so a sync must be started."
        explanation: "Correct. Without a policy the controller only compares and reports."
      - id: b
        text: "Argo CD cannot read Git."
        explanation: "An unreadable repository shows an error condition, not a clean comparison."
      - id: c
        text: "The cluster is full."
        explanation: "This would show failed resources after a sync."
      - id: d
        text: "Redis is missing."
        explanation: "Redis is not needed to start a sync."
    correct_option: a
    explanation: "No policy means compare and report only."

  - id: ats068-030-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Separate sync and health"
    source_readings:
      - sections/section-030/module-01/course-01-argo-cd-components-and-the-reconciliation-loop.md
    prompt: |-
      Which pair is correct?
    options:
      - id: a
        text: "Sync compares Git with the cluster. Health reports whether the live objects work."
        explanation: "Correct. They are two independent fields."
      - id: b
        text: "Sync reports whether pods run. Health compares Git."
        explanation: "The meanings are swapped."
      - id: c
        text: "Both fields show the same thing."
        explanation: "They can differ, for example Synced and Degraded."
      - id: d
        text: "Health is only set by a person."
        explanation: "The controller computes it."
    correct_option: a
    explanation: "`status.sync.status` and `status.health.status` answer different questions."

  - id: ats068-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the policy field for drift"
    source_readings:
      - sections/section-030/module-01/course-02-sync-policy-automated-sync-prune-and-self-heal.md
    prompt: |-
      Someone scales a managed Deployment by hand. Which setting makes Argo CD revert it?
    options:
      - id: a
        text: "`prune: true`."
        explanation: "Prune deletes objects that left Git."
      - id: b
        text: "`allowEmpty: true`."
        explanation: "This allows an empty source."
      - id: c
        text: "`selfHeal: true`."
        explanation: "Correct. Self-heal reverts live changes."
      - id: d
        text: "`CreateNamespace=true`."
        explanation: "This creates the namespace."
    correct_option: c
    explanation: "Self-heal handles drift. Prune handles removal."

  - id: ats068-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain prune"
    source_readings:
      - sections/section-030/module-01/course-02-sync-policy-automated-sync-prune-and-self-heal.md
    prompt: |-
      A manifest is removed from the Git path. With automated sync and `prune: false`, what happens to the live object?
    options:
      - id: a
        text: "It is deleted at once."
        explanation: "Deletion needs prune."
      - id: b
        text: "It stays, and the Application shows OutOfSync."
        explanation: "Correct. Argo CD reports it but does not delete it."
      - id: c
        text: "Argo CD commits the file back to Git."
        explanation: "Argo CD does not write to Git."
      - id: d
        text: "The Application is deleted."
        explanation: "The Application is not affected."
    correct_option: b
    explanation: "Without prune, removed objects stay."

  - id: ats068-030-q06
    type: single_choice
    difficulty: advanced
    learning_objective: "Order a sync"
    source_readings:
      - sections/section-030/module-01/course-03-sync-order-health-and-deleting-applications.md
    prompt: |-
      A Service must exist before a Deployment is applied. Which mechanism orders them?
    options:
      - id: a
        text: "The alphabetical order of the file names."
        explanation: "File names do not set the order."
      - id: b
        text: "Sync waves through the annotation `argocd.argoproj.io/sync-wave`."
        explanation: "Correct. Lower waves go first."
      - id: c
        text: "`replicas: 0`."
        explanation: "This does not order anything."
      - id: d
        text: "A second Application with the same name."
        explanation: "Names must be unique."
    correct_option: b
    explanation: "Waves order the apply and wait for health between waves."

  - id: ats068-030-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict deletion"
    source_readings:
      - sections/section-030/module-01/course-03-sync-order-health-and-deleting-applications.md
    prompt: |-
      An Application has the finalizer `resources-finalizer.argocd.argoproj.io` and is deleted. What happens to its objects?
    options:
      - id: a
        text: "They stay in the cluster."
        explanation: "They stay only without the finalizer."
      - id: b
        text: "They are deleted with the Application (cascade)."
        explanation: "Correct. The finalizer makes the controller delete them first."
      - id: c
        text: "They move to another namespace."
        explanation: "Objects are not moved."
      - id: d
        text: "They are scaled to zero."
        explanation: "They are deleted."
    correct_option: b
    explanation: "The finalizer turns on cascade deletion."

  - id: ats068-030-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the Flux controllers"
    source_readings:
      - sections/section-030/module-02/course-01-flux-controllers-and-the-source-pipeline.md
    prompt: |-
      Which Flux controller fetches the Git repository and publishes an artifact?
    options:
      - id: a
        text: "The helm-controller."
        explanation: "It installs charts."
      - id: b
        text: "The kustomize-controller."
        explanation: "It applies Kustomizations."
      - id: c
        text: "The notification-controller."
        explanation: "It handles events and alerts."
      - id: d
        text: "The source-controller."
        explanation: "Correct. It fetches sources and stores the artifact."
    correct_option: d
    explanation: "The source controller produces artifacts that other controllers use."

  - id: ats068-030-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a Flux revision"
    source_readings:
      - sections/section-030/module-02/course-01-flux-controllers-and-the-source-pipeline.md
    prompt: |-
      Where does Flux record the commit a GitRepository last fetched?
    options:
      - id: a
        text: "`status.artifact.revision`, in the form `main@sha1:<commit>`."
        explanation: "Correct."
      - id: b
        text: "`spec.ref.branch`."
        explanation: "This is the request."
      - id: c
        text: "`metadata.uid`."
        explanation: "The UID is unrelated."
      - id: d
        text: "`spec.interval`."
        explanation: "This is the check period."
    correct_option: a
    explanation: "The artifact revision names branch and commit."

  - id: ats068-030-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Decide the Helm release storage"
    source_readings:
      - sections/section-030/module-02/course-02-kustomization-and-helmrelease-objects.md
    prompt: |-
      A HelmRelease in `flux-system` has `targetNamespace: starfleet-staging` and no `storageNamespace`. Where is the Helm release record stored?
    options:
      - id: a
        text: "In `starfleet-staging`."
        explanation: "The default is not the target namespace."
      - id: b
        text: "In `kube-system`."
        explanation: "Not used."
      - id: c
        text: "In the namespace of the HelmRelease, `flux-system`."
        explanation: "Correct. Set `storageNamespace` to change it."
      - id: d
        text: "Nowhere. Flux does not create release records."
        explanation: "The helm-controller runs real Helm releases."
    correct_option: c
    explanation: "Storage defaults to the HelmRelease namespace."

  - id: ats068-030-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Compare pause behaviour"
    source_readings:
      - sections/section-030/module-02/course-03-comparing-argo-cd-and-flux-pause-drift-and-prune.md
    prompt: |-
      A Kustomization has `suspend: true` and the cluster object is changed by hand. What happens?
    options:
      - id: a
        text: "Flux reverts it at the next interval."
        explanation: "A suspended object is not reconciled."
      - id: b
        text: "Nothing is reverted until the object is resumed."
        explanation: "Correct. Suspension stops reconciliation."
      - id: c
        text: "Flux deletes the Kustomization."
        explanation: "Suspension does not delete."
      - id: d
        text: "Flux commits the change to Git."
        explanation: "Flux does not write to Git here."
    correct_option: b
    explanation: "Suspend stops both delivery and drift correction."

  - id: ats068-030-q12
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose the Helm chart update trigger"
    source_readings:
      - sections/section-030/module-02/course-02-kustomization-and-helmrelease-objects.md
      - sections/section-030/module-02/course-03-comparing-argo-cd-and-flux-pause-drift-and-prune.md
    prompt: |-
      A chart is read from Git and only `values.yaml` changes in a new commit. Which setting makes Flux build a new chart version from it?
    options:
      - id: a
        text: "`reconcileStrategy: Revision`."
        explanation: "Correct. A new Git revision gives a new chart artifact."
      - id: b
        text: "`reconcileStrategy: ChartVersion`."
        explanation: "It acts only when the chart version in Chart.yaml changes."
      - id: c
        text: "`prune: true`."
        explanation: "Prune is for removal."
      - id: d
        text: "`wait: true`."
        explanation: "Wait checks readiness."
    correct_option: a
    explanation: "ChartVersion needs a version bump. Revision follows the commit."

  - id: ats068-030-q13
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what a project restricts"
    source_readings:
      - sections/section-030/module-03/course-01-appproject-guardrails.md
    prompt: |-
      Which three things does an `AppProject` limit for its Applications?
    options:
      - id: a
        text: "Source repositories, destinations and resource kinds."
        explanation: "Correct. These are the main three lists."
      - id: b
        text: "Container images, CPU and memory."
        explanation: "Those are limited by Kubernetes policies, not by a project."
      - id: c
        text: "Node pools and zones."
        explanation: "A project does not manage nodes."
      - id: d
        text: "Ingress classes and DNS names."
        explanation: "A project does not manage those."
    correct_option: a
    explanation: "A project lists the allowed sources, destinations and kinds."

  - id: ats068-030-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Allow a namespace to be created"
    source_readings:
      - sections/section-030/module-03/course-01-appproject-guardrails.md
    prompt: |-
      An Application with `CreateNamespace=true` fails with a message that the kind `Namespace` is not permitted. What fixes it?
    options:
      - id: a
        text: "Add `Namespace` to the `clusterResourceWhitelist` of the project."
        explanation: "Correct. A namespace is a cluster-scoped kind."
      - id: b
        text: "Add `Namespace` to `namespaceResourceWhitelist`."
        explanation: "A namespace is not inside a namespace."
      - id: c
        text: "Add the repository to `sourceRepos`."
        explanation: "The source is not the problem."
      - id: d
        text: "Set `prune: true` on the Application."
        explanation: "Pruning does not allow creating a kind."
    correct_option: a
    explanation: "Cluster-scoped kinds need an entry in the cluster-resource list of the project."

  - id: ats068-030-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain ApplicationSet behaviour"
    source_readings:
      - sections/section-030/module-03/course-02-applicationset-generators-and-templates.md
    prompt: |-
      An element is removed from the list generator of an ApplicationSet. What happens by default?
    options:
      - id: a
        text: "The matching Application is deleted, and so is the workload it deployed."
        explanation: "Correct. The controller removes Applications that no longer have a parameter set."
      - id: b
        text: "Nothing changes until the ApplicationSet is deleted."
        explanation: "The controller reconciles on every change."
      - id: c
        text: "The Application is paused."
        explanation: "There is no pause behaviour."
      - id: d
        text: "The element is added back."
        explanation: "The controller does not add elements."
    correct_option: a
    explanation: "Use `preserveResourcesOnDeletion` to keep the workload."

  - id: ats068-030-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a generator"
    source_readings:
      - sections/section-030/module-03/course-02-applicationset-generators-and-templates.md
    prompt: |-
      A new folder under `overlays/` in Git should produce a new Application without editing the ApplicationSet. Which generator fits?
    options:
      - id: a
        text: "The Git directory generator."
        explanation: "Correct. It makes one parameter set for each matching directory."
      - id: b
        text: "The list generator."
        explanation: "A list needs an edit for every new entry."
      - id: c
        text: "The cluster generator."
        explanation: "It follows registered clusters, not folders."
      - id: d
        text: "None; this needs app of apps."
        explanation: "The Git directory generator does this."
    correct_option: a
    explanation: "The Git directory generator creates a parameter set for every directory that matches its path."

  - id: ats068-030-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use a ref source"
    source_readings:
      - sections/section-030/module-03/course-03-multiple-sources-and-ref-values.md
    prompt: |-
      In an Application with two sources, one has `ref: values`. How does the chart source read a file from it?
    options:
      - id: a
        text: "With a value file path that starts with `$values/`."
        explanation: "Correct. The prefix is replaced with the checkout of the ref source."
      - id: b
        text: "With the URL of the repository in `valueFiles`."
        explanation: "A value file path is used, not a URL."
      - id: c
        text: "It cannot; a ref source is applied as manifests."
        explanation: "A ref source is not rendered."
      - id: d
        text: "With `--values` on the command line."
        explanation: "The Application has no command line."
    correct_option: a
    explanation: "A source with only `ref` exposes its files to the other sources."

  - id: ats068-030-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Troubleshoot an ApplicationSet"
    source_readings:
      - sections/section-030/module-03/course-04-app-of-apps-generator-choices-and-troubleshooting.md
    prompt: |-
      An expected generated Application does not exist. Where is the first place to look?
    options:
      - id: a
        text: "The status conditions of the ApplicationSet and the controller logs."
        explanation: "Correct. The error from the generator or the template is reported there."
      - id: b
        text: "The Pod logs of the workload."
        explanation: "The workload does not exist without the Application."
      - id: c
        text: "The node conditions."
        explanation: "Nodes are not involved in creating Applications."
      - id: d
        text: "The Git history of the base only."
        explanation: "The generator and the template come first."
    correct_option: a
    explanation: "Work from the ApplicationSet to the Application to the sync message."

  - id: ats068-030-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Ignore a field"
    source_readings:
      - sections/section-030/module-01/course-04-diffing-ignore-rules-and-sync-options.md
    prompt: |-
      A horizontal pod autoscaler changes the replica count and the Application shows OutOfSync. Which setting fixes the false difference?
    options:
      - id: a
        text: 'An `ignoreDifferences` entry for `/spec/replicas` of the Deployment.'
        explanation: 'Correct. The field is left out of the comparison.'
      - id: b
        text: '`Replace=true`.'
        explanation: 'This overwrites the object on every sync.'
      - id: c
        text: '`PruneLast=true`.'
        explanation: 'This orders deletions.'
      - id: d
        text: '`Validate=false`.'
        explanation: 'This skips schema validation.'
    correct_option: a
    explanation: 'Add RespectIgnoreDifferences to keep the live value during a sync as well.'

  - id: ats068-030-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Order Kustomizations"
    source_readings:
      - sections/section-030/module-02/course-04-dependencies-health-checks-and-substitution.md
    prompt: |-
      How does a Flux Kustomization wait for another one to be ready before it applies?
    options:
      - id: a
        text: '`spec.dependsOn` lists the other Kustomization.'
        explanation: 'Correct. Flux waits for the listed objects to be Ready.'
      - id: b
        text: '`spec.suspend: true`.'
        explanation: 'This stops reconciliation.'
      - id: c
        text: '`spec.prune: true`.'
        explanation: 'This deletes removed objects.'
      - id: d
        text: '`spec.interval` set to a larger value.'
        explanation: 'This changes timing, not order.'
    correct_option: a
    explanation: 'Use wait or healthChecks so that Ready also means the workload runs.'
