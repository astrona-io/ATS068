# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Restrict A Project And Generate Applications With An ApplicationSet (LAB). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-068-lab-030-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and prepares credentials"
      type: file
      source: bootstrap/03-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: "Reference solution applied by astrona test"
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: appproject
      description: "AppProject starfleet allows one repository, two namespaces and only Namespace as a cluster resource"
      type: file
      source: validation/validate-appproject.sh
      hint: "Use spec.sourceRepos, spec.destinations and spec.clusterResourceWhitelist."
    - name: applicationset
      description: "ApplicationSet scout-envs generates scout-staging and scout-production in the project starfleet"
      type: file
      source: validation/validate-applicationset.sh
      hint: "Use a list generator with the elements env and namespace, and put {{env}} in the name and in the path."
    - name: delivered
      description: "Both environments are Synced and Healthy and answer with their own message"
      type: file
      source: validation/validate-delivered.sh
      hint: "Add CreateNamespace=true to the sync options of the template, and allow the kind Namespace in the project."

teardown:
  keepCluster: false
