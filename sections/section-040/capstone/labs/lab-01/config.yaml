# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Capstone: Make A Failed Delivery Visible And Recover (LAB). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-068-lab-040-capstone
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - busybox:1.37.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - ghcr.io/fluxcd/source-controller:v1.9.6
      - ghcr.io/fluxcd/kustomize-controller:v1.9.6
      - ghcr.io/fluxcd/helm-controller:v1.6.5
      - ghcr.io/fluxcd/notification-controller:v1.9.4
  portForwards:
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-flux
      description: "Installs the Flux 2.9.6 controllers"
      type: file
      source: bootstrap/02-install-flux.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and prepares credentials"
      type: file
      source: bootstrap/03-seed.sh
    - name: seed-flux-objects
      description: "Flux delivers release 1, then a bad image tag lands on main"
      type: file
      source: bootstrap/04-seed-flux-objects.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: "Reference solution applied by astrona test"
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: alert-delivers-errors
      description: "An Alert sends error events about scout-staging to the sink"
      type: file
      source: validation/validate-alert-delivers-errors.sh
      hint: "Set eventSeverity to error and create the Alert while the delivery fails."
    - name: record
      description: "ConfigMap delivery-record names the failed commit and image"
      type: file
      source: validation/validate-record.sh
      hint: "Read status.lastAttemptedRevision. The image is in the bad commit."
    - name: recovered
      description: "A new commit fixes the tag, Flux applied it and staging answers"
      type: file
      source: validation/validate-recovered.sh
      hint: "Fix forward with a new commit. Do not rewrite history."

teardown:
  keepCluster: false
