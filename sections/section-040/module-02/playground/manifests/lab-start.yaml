apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sink-cgi
  namespace: starfleet
data:
  events: |
    #!/bin/sh
    # Writes the body of every POST as one line to the log of the container.
    echo "Content-Type: text/plain"
    echo ""
    head -c "${CONTENT_LENGTH:-0}" | tr -d '\n' >> /proc/1/fd/1
    echo "" >> /proc/1/fd/1
    echo "ok"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink
  namespace: starfleet
  labels:
    app: sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sink
  template:
    metadata:
      labels:
        app: sink
    spec:
      containers:
        - name: sink
          image: busybox:1.37.0
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: cgi
              mountPath: /www/cgi-bin
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: cgi
          configMap:
            name: sink-cgi
            items:
              - key: events
                path: events
                mode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: sink
  namespace: starfleet
spec:
  selector:
    app: sink
  ports:
    - name: http
      port: 80
      targetPort: http
