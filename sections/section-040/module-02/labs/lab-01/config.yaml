# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Update Images With Flux Image Automation (LAB). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-068-lab-040-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - busybox:1.37.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - ghcr.io/fluxcd/source-controller:v1.9.6
      - ghcr.io/fluxcd/kustomize-controller:v1.9.6
      - ghcr.io/fluxcd/helm-controller:v1.6.5
      - ghcr.io/fluxcd/notification-controller:v1.9.4
  portForwards:
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-flux
      description: "Installs the Flux 2.9.6 controllers, including the image controllers"
      type: file
      source: bootstrap/02-install-flux.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and creates the Secret scout-write"
      type: file
      source: bootstrap/03-seed.sh
    - name: seed-flux-objects
      description: "Flux delivers the staging overlay from the GitRepository scout"
      type: file
      source: bootstrap/04-seed-flux-objects.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: "Reference solution applied by astrona test"
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: imagepolicy
      description: "ImageRepository scout scans podinfo and ImagePolicy scout selects a 6.15 tag"
      type: file
      source: validation/validate-imagepolicy.sh
      hint: "The ImagePolicy refers to the ImageRepository by name and sets policy.semver.range."
    - name: automation
      description: "ImageUpdateAutomation scout reads GitRepository scout and pushes to main"
      type: file
      source: validation/validate-automation.sh
      hint: "Set sourceRef, git.checkout, git.commit.author, git.push and update.path with the Setters strategy."
    - name: delivered
      description: "The new tag is committed to Git by fluxbot and rolled out"
      type: file
      source: validation/validate-delivered.sh
      hint: "The marker comment in overlays/staging/kustomization.yaml names flux-system:scout:tag."

teardown:
  keepCluster: false
