# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Notify And Trigger Flux With Webhooks (LAB). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-068-lab-040-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - busybox:1.37.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - ghcr.io/fluxcd/source-controller:v1.9.6
      - ghcr.io/fluxcd/kustomize-controller:v1.9.6
      - ghcr.io/fluxcd/helm-controller:v1.6.5
      - ghcr.io/fluxcd/notification-controller:v1.9.4
  portForwards:
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-flux
      description: "Installs the Flux 2.9.6 controllers"
      type: file
      source: bootstrap/02-install-flux.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git and prepares credentials"
      type: file
      source: bootstrap/03-seed.sh
    - name: seed-flux-objects
      description: "Flux delivers the staging overlay"
      type: file
      source: bootstrap/04-seed-flux-objects.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: "Reference solution applied by astrona test"
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: receiver
      description: "Receiver scout-push is a Ready generic Receiver for the GitRepository scout"
      type: file
      source: validation/validate-receiver.sh
      hint: "The Receiver needs a Secret with a token key and a resources list."
    - name: alert
      description: "Provider sink and Alert scout-events are defined"
      type: file
      source: validation/validate-alert.sh
      hint: "The Alert refers to the Provider by name and lists event sources."
    - name: delivered
      description: "A push plus one webhook call makes Flux fetch, apply and notify"
      type: file
      source: validation/validate-delivered.sh
      hint: "The GitRepository interval is one hour. Read status.webhookPath."

teardown:
  keepCluster: false
